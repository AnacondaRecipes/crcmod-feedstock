{% set name = "crcmod" %}
{% set version = "1.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/crcmod-{{ version }}.tar.gz
  sha256: dc7051a0db5f2bd48665a990d3ec1cc305a466a77358ca4492826f41f283601e

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - pip
    - python
    - setuptools
  run:
    - python

test:
  imports:
    - crcmod
    - crcmod._crcfunext
  requires:
    - pip
  commands:
    - pip check
    # Tests fail only for osx and py==313 on CI
    - python -m crcmod.test  # [not (osx and py==313)]

about:
  home: https://crcmod.sourceforge.net/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: CRC Generator
  description: |
     Python module for generating objects that compute the Cyclic Redundancy
     Check (CRC)
  doc_url: https://crcmod.sourceforge.net/
  dev_url: https://sourceforge.net/projects/crcmod/

extra:
  recipe-maintainers:
    - bgruening
    - chapmanb
    - xylar
    - nehaljwani
